[project]
name = "stat-manager"
version = "0.1.0"
description = "Expense Tracker API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "mysql-connector-python>=26.10.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
